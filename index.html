<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFHC — Website for Homework Control</title>
<style>
  :root{
    --bg:#faf7f8; --card:#fff; --ink:#1c2230; --muted:#6b7280; --line:#e5e7eb;
    --brand:#7b1e3a; --brand-dark:#5c1229; --brand-soft:#f6e9ed; --brand-ink:#fff;
    --ok:#16a34a; --ok-bg:#dcfce7; --late:#d97706; --late-bg:#fef3c7;
    --miss:#dc2626; --miss-bg:#fee2e2; --pend:#9ca3af; --pend-bg:#f3f4f6;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header.top{background:var(--brand);color:#fff;border-bottom:1px solid var(--brand-dark);position:sticky;top:0;z-index:5}
  header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
  .logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
  .logo i{display:inline-block;width:26px;height:26px;border-radius:7px;background:#fff;color:var(--brand);font-style:normal;text-align:center;line-height:26px;font-size:14px}
  .spacer{flex:1}
  .who{color:#f3dfe5;font-size:13px;text-align:right}
  header.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
  header.top .btn:hover{background:rgba(255,255,255,.12)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h1{font-size:22px;margin:4px 0 14px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 4px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600}
  .btn:hover{background:#f9fafb}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
  .btn.danger{color:var(--miss)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .link{background:none;border:none;color:var(--brand);cursor:pointer;padding:0;font-weight:600}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  input[type=text],input[type=email],input[type=password],input[type=datetime-local],select,textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .err{color:var(--miss);font-size:13px;margin-top:8px;min-height:1em}
  .ok-msg{color:var(--ok);font-weight:600}
  .auth{max-width:400px;margin:40px auto}
  .hero{text-align:center;padding:26px 0 4px}
  .hero h1{font-size:40px;letter-spacing:2px;margin:0 0 6px;color:var(--brand)}
  .hero-sub{font-weight:700;letter-spacing:.3px;margin-bottom:10px}
  .hero p{margin:0 auto;max-width:520px;color:var(--muted)}
  .landing .auth{margin:20px auto 34px}
  .section-title{text-align:center;font-size:22px;margin:10px 0 16px;color:var(--brand)}
  .teachers{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:980px;margin:0 auto 30px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .tcard-top{display:flex;gap:18px;align-items:center}
  .tcard-top img{width:150px;height:186px;object-fit:cover;object-position:top;border-radius:14px;background:#f2f2f2;flex-shrink:0}
  .tcard-top h3{font-size:26px;margin:0 0 8px}
  .role{display:inline-block;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 6px}
  .stat{border:1.5px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px}
  .stat b{display:block;font-size:22px;color:var(--brand)}
  .stat span{font-size:12px;color:var(--muted)}
  .tcard ul{padding-left:20px;margin:10px 0}
  .tcard li{margin-bottom:5px}
  .tcard hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .tcard h4{margin:0 0 4px;font-size:15px}
  .tcard a.contact{color:var(--brand);font-weight:700}
  @media(max-width:420px){.tcard-top img{width:120px;height:150px}.tcard-top h3{font-size:22px}}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
  .tabs button{background:none;border:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .demo-bar{background:var(--brand-soft);color:var(--brand-dark);font-size:13px;padding:8px 16px;text-align:center}
  /* status */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .s-ontime{background:var(--ok-bg);color:var(--ok)} .s-late{background:var(--late-bg);color:var(--late)}
  .s-missing{background:var(--miss-bg);color:var(--miss)} .s-pending{background:var(--pend-bg);color:#4b5563}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--pend)}
  .tile b{display:block;font-size:24px} .tile span{font-size:13px;color:var(--muted)}
  .tile.ontime{border-left-color:var(--ok)} .tile.late{border-left-color:var(--late)} .tile.missing{border-left-color:var(--miss)}
  .hw{border-left:5px solid var(--pend)}
  .hw.ontime{border-left-color:var(--ok)} .hw.late{border-left-color:var(--late)} .hw.missing{border-left-color:var(--miss)}
  .hw-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .file{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;background:#fafafa;max-width:100%;text-decoration:none;color:var(--ink)}
  .file img{width:42px;height:42px;object-fit:cover;border-radius:5px}
  .file .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
  .drop{border:2px dashed #cbd5e1;border-radius:10px;padding:14px;text-align:center;margin-top:12px;background:#fbfcfe}
  .progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}
  .progress div{height:100%;background:var(--brand);width:0;transition:width .2s}
  .success{background:var(--ok-bg);color:#14532d;border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600}
  /* teacher chart */
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
  table.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  .matrix th,.matrix td{padding:6px;border-bottom:1px solid var(--line);text-align:center;background:#fff}
  .matrix thead th{position:sticky;top:0;z-index:2;font-weight:600;vertical-align:bottom;min-width:84px}
  .matrix th.name,.matrix td.name{position:sticky;left:0;z-index:1;text-align:left;min-width:150px;max-width:200px;border-right:1px solid var(--line)}
  .matrix thead th.name{z-index:3}
  .matrix .dl{display:block;font-weight:400;color:var(--muted);font-size:11px}
  .cell{display:block;width:100%;min-width:60px;height:32px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px}
  .cell.ontime{background:var(--ok);color:#fff} .cell.late{background:var(--late);color:#fff}
  .cell.missing{background:var(--miss);color:#fff} .cell.pending{background:var(--pend-bg);color:#6b7280}
  .pct{font-weight:700}
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:grid;grid-template-columns:minmax(110px,220px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
  @media(max-width:640px){.bar-row{grid-template-columns:1fr auto}.bar-row .bar{grid-column:1/-1;grid-row:2}}
  .bar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--pend-bg)}
  .bar span{height:100%}
  .missing-list li{margin-bottom:6px}
  .chip{display:inline-block;background:var(--miss-bg);color:var(--miss);border-radius:999px;padding:2px 9px;margin:2px;font-size:12px;font-weight:600}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:2px;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:8px}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px}
  .modal img.big{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)}
  .empty{text-align:center;padding:30px 10px;color:var(--muted)}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both}
  .toast.out{animation:toastOut .3s ease both}
  /* ---------- motion ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}
  main.wrap>*,#tabBody>*,.teachers>.tcard,.landing>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
  main.wrap>*:nth-child(2),#tabBody>*:nth-child(2),.teachers>.tcard:nth-child(2),.landing>*:nth-child(2){animation-delay:.06s}
  main.wrap>*:nth-child(3),#tabBody>*:nth-child(3),.teachers>.tcard:nth-child(3),.landing>*:nth-child(3){animation-delay:.12s}
  main.wrap>*:nth-child(4),.landing>*:nth-child(4){animation-delay:.18s}
  main.wrap>*:nth-child(5),.landing>*:nth-child(5){animation-delay:.22s}
  main.wrap>*:nth-child(n+6){animation-delay:.26s}
  .landing{animation:none!important}
  .btn{transition:background .18s,border-color .18s,transform .12s,box-shadow .18s}
  .btn:active:not(:disabled){transform:scale(.96)}
  .btn.primary:not(:disabled):hover{box-shadow:0 4px 14px rgba(123,30,58,.28)}
  .btn .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
  .btn.busy{opacity:1;cursor:progress}
  .loader-screen{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-weight:600}
  .loader-screen .ring{width:46px;height:46px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  .modal-bg{animation:fadeIn .2s ease both}
  .modal{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
  .modal-bg.out{animation:fadeIn .18s ease reverse both}
  .tcard,.card.hw,.tile{transition:transform .22s ease,box-shadow .22s ease}
  .tcard:hover,.card.hw:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(123,30,58,.10)}
  .cell{transition:transform .14s ease,filter .14s}
  .cell:hover{transform:scale(1.08);filter:brightness(1.06)}
  .bar{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
  .tabs button{transition:color .2s,border-color .25s}
  input,select,textarea{transition:border-color .18s,box-shadow .18s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(123,30,58,.14)}
  .success{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const TEACHER_EMAILS = ["ngulomov637@gmail.com", "nodirbek637@gmail.com"];

/* ========================================================= */
const DEMO = firebaseConfig.apiKey.startsWith("PASTE");
const isTeacherEmail = e => TEACHER_EMAILS.map(x => x.toLowerCase()).includes((e || "").toLowerCase());
const MAX_FILES = 10, MAX_MB = 6;   // files are stored inside Firebase (Firestore), so keep them small

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = ms => new Date(ms).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtShort = ms => new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" });
function timeLeft(ms) {
  const d = ms - Date.now(); if (d <= 0) return "closed";
  const m = Math.floor(d / 60000), h = Math.floor(m / 60), days = Math.floor(h / 24);
  if (days >= 1) return `${days}d ${h % 24}h left`;
  if (h >= 1) return `${h}h ${m % 60}m left`;
  return `${m}m left`;
}
function statusOf(a, sub) {
  if (sub) return sub.submittedAt > a.deadline ? "late" : "ontime";
  return Date.now() > a.deadline ? "missing" : "pending";
}
const LABEL = { ontime: "On time", late: "Late", missing: "Not submitted", pending: "Not yet due" };
const ICON = { ontime: "✓", late: "L", missing: "✗", pending: "·" };
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 2600);
}
// Show a spinner + text on a button while something is happening. Returns a function that restores it.
function busy(btn, text) {
  if (!btn) return () => {};
  const html = btn.innerHTML; btn.disabled = true; btn.classList.add("busy");
  btn.innerHTML = `<span class="spin"></span>${esc(text)}`;
  return () => { if (btn.isConnected) { btn.innerHTML = html; btn.disabled = false; btn.classList.remove("busy"); } };
}
function loaderScreen(msg) {
  shell(`<div class="loader-screen"><div class="ring"></div><div>${esc(msg)}</div></div>`);
}
function modal(html) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-close]")) { bg.classList.add("out"); setTimeout(() => bg.remove(), 180); } });
  document.body.appendChild(bg); return bg;
}
function askConfirm(msg, yes = "Delete") {
  return new Promise(res => {
    const m = modal(`<p style="margin-top:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" data-yes style="background:var(--miss);border-color:var(--miss)">${esc(yes)}</button></div>`);
    m.querySelector("[data-yes]").onclick = () => { m.remove(); res(true); };
    m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) res(false); });
  });
}
const isImg = f => (f.type || "").startsWith("image/");
function niceError(e) {
  const c = e?.code || "";
  const map = {
    "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "No account with this email.", "auth/email-already-in-use": "This email already has an account. Sign in instead.",
    "auth/weak-password": "Password must be at least 6 characters.", "auth/invalid-email": "Please enter a valid email.",
    "permission-denied": "Not allowed. (If the deadline passed, you can't replace a submission.)",
    "too-big": "This file is too big (max " + MAX_MB + " MB). Try a smaller photo or a PDF."
  };
  return map[c] || e?.message || String(e);
}

// Shrink phone photos before upload (saves storage & data). Falls back to the original file.
async function compressImage(file) {
  if (!isImg(file) || file.type === "image/gif" || file.size < 300 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch { return file; }
}

async function makeFirebaseApi() {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  const ms = t => (t && t.toMillis) ? t.toMillis() : (typeof t === "number" ? t : Date.now());
  const rows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  let pendingName = null;

  async function loadProfile(u) {
    const ref = F.doc(db, "users", u.uid);
    let snap = await F.getDoc(ref);
    if (!snap.exists()) {
      await F.setDoc(ref, { name: pendingName || u.displayName || u.email.split("@")[0], email: u.email.toLowerCase(), classIds: [], createdAt: F.serverTimestamp() });
      snap = await F.getDoc(ref);
    }
    const d = snap.data();
    return { uid: u.uid, email: u.email, name: d.name, classIds: d.classIds || [], teacher: isTeacherEmail(u.email) };
  }
  const normSub = s => ({ ...s, submittedAt: ms(s.submittedAt) });
  const normA = a => ({ ...a, deadline: ms(a.deadline) });
  const CHUNK = 700000, urlCache = {};
  async function deleteFileDoc(id, count) {
    if (count == null) { const m = await F.getDoc(F.doc(db, "files", id)); if (!m.exists()) return; count = m.data().chunkCount; }
    for (let i = 0; i < count; i++) await F.deleteDoc(F.doc(db, "files", id, "chunks", String(i)));
    await F.deleteDoc(F.doc(db, "files", id));
  }

  return {
    onAuth(cb) { A.onAuthStateChanged(auth, async u => { try { cb(u ? await loadProfile(u) : null); } catch (e) { console.error(e); cb(null, e); } }); },
    async signUp(name, email, pw) { pendingName = name.trim(); const c = await A.createUserWithEmailAndPassword(auth, email, pw); await A.updateProfile(c.user, { displayName: pendingName }); },
    signIn: (email, pw) => A.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => A.signOut(auth),
    resetPassword: email => A.sendPasswordResetEmail(auth, email),
    async me() { return loadProfile(auth.currentUser); },
    // classes
    async listClasses() { return rows(await F.getDocs(F.collection(db, "classes"))).sort((a, b) => a.name.localeCompare(b.name)); },
    async getClasses(ids) { const out = []; for (const id of ids) { const s = await F.getDoc(F.doc(db, "classes", id)); if (s.exists()) out.push({ id, ...s.data() }); } return out; },
    async createClass(name) {
      const ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let code = "";
      for (let i = 0; i < 6; i++) code += ABC[Math.floor(Math.random() * ABC.length)];
      const ref = F.doc(F.collection(db, "classes"));
      const b = F.writeBatch(db);
      b.set(ref, { name, code, createdAt: F.serverTimestamp() });
      b.set(F.doc(db, "joinCodes", code), { classId: ref.id });
      await b.commit(); return { id: ref.id, name, code };
    },
    async joinClass(code) {
      const s = await F.getDoc(F.doc(db, "joinCodes", code.trim().toUpperCase()));
      if (!s.exists()) throw new Error("That class code doesn't exist. Check it with your teacher.");
      await F.updateDoc(F.doc(db, "users", auth.currentUser.uid), { classIds: F.arrayUnion(s.data().classId) });
      return s.data().classId;
    },
    async listStudents(cid) { return rows(await F.getDocs(F.query(F.collection(db, "users"), F.where("classIds", "array-contains", cid)))).map(u => ({ ...u, uid: u.id })).filter(u => !isTeacherEmail(u.email)).sort((a, b) => a.name.localeCompare(b.name)); },
    removeStudent: (cid, uid) => F.updateDoc(F.doc(db, "users", uid), { classIds: F.arrayRemove(cid) }),
    // assignments
    async listAssignments(cid) { return rows(await F.getDocs(F.query(F.collection(db, "assignments"), F.where("classId", "==", cid)))).map(normA).sort((a, b) => a.deadline - b.deadline); },
    createAssignment: a => F.addDoc(F.collection(db, "assignments"), { classId: a.classId, title: a.title, description: a.description || "", deadline: F.Timestamp.fromMillis(a.deadline), createdAt: F.serverTimestamp() }),
    async deleteAssignment(id) {
      // free up space: remove the uploaded files and submissions of this homework
      const fl = await F.getDocs(F.query(F.collection(db, "files"), F.where("assignmentId", "==", id)));
      for (const d of fl.docs) await deleteFileDoc(d.id, d.data().chunkCount);
      const sb = await F.getDocs(F.query(F.collection(db, "submissions"), F.where("assignmentId", "==", id)));
      for (const d of sb.docs) await F.deleteDoc(d.ref);
      await F.deleteDoc(F.doc(db, "assignments", id));
    },
    // submissions
    async listSubmissions(cid) { return rows(await F.getDocs(F.query(F.collection(db, "submissions"), F.where("classId", "==", cid)))).map(normSub); },
    async mySubmissions(cid) { return rows(await F.getDocs(F.query(F.collection(db, "submissions"), F.where("classId", "==", cid), F.where("studentId", "==", auth.currentUser.uid)))).map(normSub); },
    async submit(a, me, files, onProgress, previous) {
      const uid = auth.currentUser.uid, total = files.reduce((n, f) => n + f.size, 0) || 1;
      let doneBytes = 0; const out = [];
      for (const f of files) {
        const b64 = await fileToBase64(f), n = Math.max(1, Math.ceil(b64.length / CHUNK));
        const ref = F.doc(F.collection(db, "files"));
        await F.setDoc(ref, { studentId: uid, classId: a.classId, assignmentId: a.id, name: f.name, type: f.type || "application/octet-stream", size: f.size, chunkCount: n, createdAt: F.serverTimestamp() });
        for (let i = 0; i < n; i++) {
          await F.setDoc(F.doc(db, "files", ref.id, "chunks", String(i)), { data: b64.slice(i * CHUNK, (i + 1) * CHUNK) });
          onProgress((doneBytes + f.size * (i + 1) / n) / total);
        }
        doneBytes += f.size;
        out.push({ id: ref.id, name: f.name, type: f.type || "", size: f.size });
      }
      await F.setDoc(F.doc(db, "submissions", `${a.id}_${uid}`), {
        assignmentId: a.id, classId: a.classId, studentId: uid, studentName: me.name,
        files: out, submittedAt: F.serverTimestamp()
      });
      // remove the files of an earlier attempt to save space (ignore errors)
      for (const f of (previous?.files || [])) if (f.id) deleteFileDoc(f.id).catch(() => {});
    },
    // rebuild a stored file and give back a local link to show/open it
    async fileUrl(f) {
      if (urlCache[f.id]) return urlCache[f.id];
      const meta = (await F.getDoc(F.doc(db, "files", f.id))).data();
      if (!meta) throw new Error("File not found");
      const parts = await Promise.all([...Array(meta.chunkCount)].map((_, i) => F.getDoc(F.doc(db, "files", f.id, "chunks", String(i)))));
      const bin = atob(parts.map(p => p.data().data).join(""));
      const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return urlCache[f.id] = URL.createObjectURL(new Blob([bytes], { type: meta.type }));
    }
  };
}

function fileToBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(file); });
}

/* ---------- student ---------- */
async function renderStudent() {
  const g = authGen;
  const prof = await api.me();
  if (g !== authGen) return;
  me = prof;
  if (!me.classIds.length) return renderJoin(true);
  const classes = await api.getClasses(me.classIds);
  if (g !== authGen) return;
  if (!classes.length) return renderJoin(true);
  if (!classes.find(c => c.id === state.classId)) state.classId = classes[0].id;
  const [assignments, subs] = await Promise.all([api.listAssignments(state.classId), api.mySubmissions(state.classId)]);
  if (g !== authGen) return;
  const subBy = Object.fromEntries(subs.map(s => [s.assignmentId, s]));
  const items = assignments.map(a => ({ a, sub: subBy[a.id], st: statusOf(a, subBy[a.id]) }));
  const count = k => items.filter(i => i.st === k).length;
  // Order: still open (soonest first) → then past ones (most recent first)
  const open = items.filter(i => i.a.deadline > Date.now()).sort((x, y) => x.a.deadline - y.a.deadline);
  const past = items.filter(i => i.a.deadline <= Date.now()).sort((x, y) => y.a.deadline - x.a.deadline);

  shell(`
    <div class="row" style="justify-content:space-between">
      <h1>My homework</h1>
      <div class="row">
        ${classes.length > 1 ? `<select id="cls" style="width:auto">${classes.map(c => `<option value="${c.id}" ${c.id === state.classId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>` : `<span class="muted">${esc(classes[0].name)}</span>`}
        <button class="btn sm" id="joinMore">+ Join class</button>
      </div>
    </div>
    <div class="tiles">
      <div class="tile ontime"><b>${count("ontime")}</b><span>On time</span></div>
      <div class="tile late"><b>${count("late")}</b><span>Late</span></div>
      <div class="tile missing"><b>${count("missing")}</b><span>Not submitted</span></div>
      <div class="tile"><b>${count("pending")}</b><span>To do</span></div>
    </div>
    ${items.length ? "" : `<div class="card empty">No homework yet. 🎉</div>`}
    ${open.length ? `<h2>Open</h2>${open.map(hwCard).join("")}` : ""}
    ${past.length ? `<h2 style="margin-top:18px">Past deadline</h2>${past.map(hwCard).join("")}` : ""}
  `);
  $("#cls")?.addEventListener("change", e => { state.classId = e.target.value; loaderScreen("Loading class…"); renderStudent(); });
  $("#joinMore").onclick = () => renderJoin(false);
  items.forEach(i => wireUpload(i));
  hydrateFiles(app);
}

        <button class="btn primary hidden" data-send style="margin-top:10px">${sub ? "Replace homework" : "Submit homework"}</button>
        <div class="progress hidden" data-prog><div></div></div>
      </div>` : `<div class="small muted" style="margin-top:8px">Submissions closed.</div>`}
  </div>`;
}
function fileChip(f, removable) {
  const src = f.url || "", lazy = !f.url && f.id ? ` data-fid="${esc(f.id)}" data-ftype="${esc(f.type)}"` : "";
  const thumb = isImg(f) ? `<img src="${esc(src)}" alt="" data-thumb>` : `<span style="font-size:20px">📄</span>`;
  return `<${removable ? "span" : `a href="${esc(src) || "#"}" target="_blank" rel="noopener"${lazy}`} class="file">${thumb}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${esc(f.name)}</span>${removable ? `<button class="x" data-rm="${removable}" title="Remove">×</button>` : ""}</${removable ? "span" : "a"}>`;
}
// Load files stored in Firebase and plug them into links / images on screen
function hydrateFiles(root = document) {
  root.querySelectorAll("[data-fid]").forEach(async el => {
    const id = el.dataset.fid; el.removeAttribute("data-fid");
    try {
      const url = await api.fileUrl({ id });
      if (el.tagName === "A") { el.href = url; const im = el.querySelector("img[data-thumb]"); if (im) im.src = url; }
      else if (el.tagName === "IMG") { el.src = url; el.closest("a") && (el.closest("a").href = url); }
    } catch (e) { console.error(e); el.style.opacity = .5; el.title = "Could not load file"; }
  });
}

function wireUpload({ a, sub }) {
  const card = $("#hw-" + a.id); if (!card || !card.querySelector("[data-send]")) return;
  let picked = [];
  const box = card.querySelector("[data-picked]"), send = card.querySelector("[data-send]"), err = card.querySelector("[data-err]");
  const draw = () => {
    box.innerHTML = picked.map((p, i) => fileChip({ name: p.file.name, type: p.file.type, url: p.url }, String(i + 1))).join("");
    send.classList.toggle("hidden", !picked.length);
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { picked.splice(+b.dataset.rm - 1, 1); draw(); });
  };
  card.querySelectorAll("[data-pick]").forEach(inp => inp.onchange = () => {
    err.textContent = "";
    for (const f of inp.files) {
      if (f.size > (isImg(f) ? 30 : MAX_MB) * 1024 * 1024) { err.textContent = `${f.name} is too big (max ${MAX_MB} MB for PDF/Word).`; continue; }
      if (picked.length >= MAX_FILES) { err.textContent = `Maximum ${MAX_FILES} files.`; break; }
      picked.push({ file: f, url: isImg(f) ? URL.createObjectURL(f) : "" });
    }
    inp.value = ""; draw();
  });
  send.onclick = async () => {
    const done = busy(send, "Uploading…"); err.textContent = "";
    const prog = card.querySelector("[data-prog]"); prog.classList.remove("hidden");
    try {
      const files = await Promise.all(picked.map(p => compressImage(p.file)));
      const big = files.find(f => f.size > MAX_MB * 1024 * 1024);
      if (big) throw new Error(`${big.name} is too big (max ${MAX_MB} MB). Try a smaller file.`);
      await api.submit(a, me, files, p => { const n = Math.round(p * 100); prog.firstElementChild.style.width = n + "%"; send.innerHTML = `<span class="spin"></span>Uploading… ${n}%`; }, sub);
      toast(Date.now() > a.deadline ? "Homework sent (late)." : "Homework uploaded successfully ✓");
      await renderStudent();
      $("#hw-" + a.id)?.scrollIntoView({ block: "center" });
    } catch (e) { console.error(e); err.textContent = niceError(e); done(); prog.classList.add("hidden"); }
  };
}

function renderJoin(first) {
  shell(`<div class="auth card">
    <h2>${first ? "Join your class" : "Join another class"}</h2>
    <p class="muted small">Ask your teacher for the 6-letter class code.</p>
    <form id="joinForm"><input type="text" name="code" required maxlength="6" placeholder="e.g. ENG9AB" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
    <div class="err" id="joinErr"></div>
    <div class="row"><button class="btn primary">Join</button>${first ? "" : `<button type="button" class="btn" id="back">Back</button>`}</div></form>
    ${DEMO ? `<p class="small muted">Demo codes: ENG9AB, ENG10X</p>` : ""}
  </div>`);
  $("#back")?.addEventListener("click", renderStudent);
  $("#joinForm").onsubmit = async e => {
    e.preventDefault(); const done = busy(e.target.querySelector("button.primary"), "Joining…");
    try { state.classId = await api.joinClass(e.target.code.value); toast("Joined!"); await renderStudent(); }
    catch (err) { $("#joinErr").textContent = niceError(err); done(); }
  };
}

/* ---------- teacher ---------- */
let T = {}; // cached teacher data for current class
async function renderTeacher(refetch = true) {
  if (!refetch && T.cls) return drawTeacher();
  const g = authGen;
  const classes = await api.listClasses();
  if (g !== authGen) return;
  if (!classes.length) return renderNewClass(true);
  if (!classes.find(c => c.id === state.classId)) state.classId = classes[0].id;
  const cls = classes.find(c => c.id === state.classId);
  const [students, assignments, subs] = await Promise.all([api.listStudents(cls.id), api.listAssignments(cls.id), api.listSubmissions(cls.id)]);
  if (g !== authGen) return;
  const subMap = {}; subs.forEach(s => subMap[s.assignmentId + "|" + s.studentId] = s);
  T = { classes, cls, students, assignments, subMap };
  drawTeacher();
}
function drawTeacher() {
  const { classes, cls, students, assignments } = T;
  shell(`
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div class="row"><select id="cls" style="width:auto;font-weight:700">${classes.map(c => `<option value="${c.id}" ${c.id === cls.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <button class="btn sm" id="newClass">+ New class</button></div>
      <div class="small">Class code: <span class="code">${esc(cls.code)}</span> <button class="btn sm" id="copyCode">Copy</button></div>
    </div>
    <div class="tabs">
      ${[["overview", "Overview"], ["assignments", `Homework (${assignments.length})`], ["students", `Students (${students.length})`]]
        .map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "on" : ""}">${l}</button>`).join("")}
      <div class="spacer"></div><button class="btn sm" id="refresh" style="align-self:center">↻ Refresh</button>
    </div>
    <div id="tabBody"></div>`);
  $("#cls").onchange = e => { state.classId = e.target.value; loaderScreen("Loading class…"); renderTeacher(); };
  $("#newClass").onclick = () => renderNewClass(false);
  $("#copyCode").onclick = () => navigator.clipboard?.writeText(cls.code).then(() => toast("Code copied"));
  $("#refresh").onclick = async () => { const done = busy($("#refresh"), "Refreshing…"); try { await renderTeacher(); toast("Up to date"); } catch (e) { done(); toast(niceError(e)); } };
  // switching tabs is instant: reuse the data we already loaded
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab;
    app.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b));
    drawTab();
  });
  drawTab();
}
function drawTab() {
  ({ overview: tabOverview, assignments: tabAssignments, students: tabStudents })[state.tab]();
}

function tabOverview() {
  const { students, assignments, subMap } = T, body = $("#tabBody");
  if (!students.length || !assignments.length) {
    body.innerHTML = `<div class="card empty">${!students.length ? `No students yet. Give them the class code <span class="code">${esc(T.cls.code)}</span> — they enter it after creating an account.` : ""}
      ${!assignments.length ? `<p>No homework yet. <button class="link" id="goA">Add the first homework →</button></p>` : ""}</div>`;
    $("#goA")?.addEventListener("click", () => { state.tab = "assignments"; renderTeacher(false); });
    return;
  }
  const st = (a, s) => statusOf(a, subMap[a.id + "|" + s.uid]);
  const dueAs = assignments.filter(a => a.deadline <= Date.now());
  let tot = { ontime: 0, late: 0, missing: 0 };
  dueAs.forEach(a => students.forEach(s => tot[st(a, s)]++));
  const dueTotal = dueAs.length * students.length || 1;

  const bars = assignments.map(a => {
    const c = { ontime: 0, late: 0, missing: 0, pending: 0 }; students.forEach(s => c[st(a, s)]++);
    const n = students.length, seg = (k, col) => c[k] ? `<span style="width:${c[k] / n * 100}%;background:${col}" title="${LABEL[k]}: ${c[k]}"></span>` : "";
    return `<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.title)}">${esc(a.title)}</div>
      <div class="bar">${seg("ontime", "var(--ok)")}${seg("late", "var(--late)")}${seg("missing", "var(--miss)")}</div>
      <div class="small">${c.ontime + c.late}/${n} sent</div></div>`;
  }).join("");

  const missingByA = dueAs.slice().reverse().map(a => ({ a, who: students.filter(s => st(a, s) === "missing") })).filter(x => x.who.length);

  body.innerHTML = `
    <div class="tiles">
      <div class="tile ontime"><b>${Math.round(tot.ontime / dueTotal * 100)}%</b><span>On time (${tot.ontime})</span></div>
      <div class="tile late"><b>${Math.round(tot.late / dueTotal * 100)}%</b><span>Late (${tot.late})</span></div>
      <div class="tile missing"><b>${Math.round(tot.missing / dueTotal * 100)}%</b><span>Not submitted (${tot.missing})</span></div>
      <div class="tile"><b>${assignments.length - dueAs.length}</b><span>Still open</span></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Who did the homework</h2><button class="btn sm" id="csv">⬇ Export CSV</button></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>On time</span><span><i style="background:var(--late)"></i>Late</span><span><i style="background:var(--miss)"></i>Not submitted (deadline passed)</span><span><i style="background:var(--pend-bg);border:1px solid #d1d5db"></i>Not yet due</span></div>
      <div class="matrix-wrap"><table class="matrix">
        <thead><tr><th class="name">Student</th>${assignments.map(a => `<th title="${esc(a.title)}">${esc(a.title.length > 18 ? a.title.slice(0, 17) + "…" : a.title)}<span class="dl">${fmtShort(a.deadline)}</span></th>`).join("")}<th>Done</th></tr></thead>
        <tbody>${students.map(s => {
          const done = dueAs.filter(a => ["ontime", "late"].includes(st(a, s))).length;
          const pct = dueAs.length ? Math.round(done / dueAs.length * 100) : null;
          return `<tr><td class="name">${esc(s.name)}</td>${assignments.map(a => { const k = st(a, s);
            return `<td><button class="cell ${k}" data-a="${a.id}" data-s="${s.uid}" title="${esc(s.name)} — ${LABEL[k]}">${ICON[k]}</button></td>`; }).join("")}
            <td class="pct" style="color:${pct === null ? "var(--muted)" : pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--late)" : "var(--miss)"}">${pct === null ? "—" : pct + "%"}</td></tr>`;
        }).join("")}</tbody></table></div>
      <p class="small muted" style="margin-bottom:0">Tap any square to see the uploaded files.</p>
    </div>
    <div class="card"><h2>Submissions per homework</h2><div class="bars">${bars}</div></div>
    <div class="card"><h2>Missing homework</h2>
      ${missingByA.length ? `<ul class="missing-list" style="padding-left:18px;margin:0">${missingByA.map(x => `<li><b>${esc(x.a.title)}</b> <span class="small muted">(due ${fmtShort(x.a.deadline)})</span><br>${x.who.map(s => `<span class="chip">${esc(s.name)}</span>`).join("")}</li>`).join("")}</ul>`
        : `<p class="ok-msg" style="margin:0">Everyone has submitted every past-due homework. 🎉</p>`}
    </div>`;
  body.querySelectorAll(".cell").forEach(b => b.onclick = () => showSubmission(b.dataset.a, b.dataset.s));
  $("#csv").onclick = exportCSV;
}

function showSubmission(aid, uid) {
  const a = T.assignments.find(x => x.id === aid), s = T.students.find(x => x.uid === uid), sub = T.subMap[aid + "|" + uid], k = statusOf(a, sub);
  const m = modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)}</h2><button class="btn sm" data-close>Close</button></div>
    <p class="muted small" style="margin:4px 0 10px">${esc(a.title)} · due ${fmt(a.deadline)}</p>
    <span class="badge s-${k}">${LABEL[k]}</span>
    ${sub ? `<p class="small">Submitted ${fmt(sub.submittedAt)}${k === "late" ? ` — ${lateBy(sub.submittedAt - a.deadline)} late` : ""}</p>
      ${sub.files.map(f => isImg(f) ? `<a href="${esc(f.url || "#")}" target="_blank" rel="noopener"><img class="big" src="${esc(f.url || "")}" alt="${esc(f.name)}" ${!f.url && f.id ? `data-fid="${esc(f.id)}"` : ""}></a>` : `<div class="files">${fileChip(f)}</div>`).join("")}`
      : `<p class="muted">${k === "missing" ? "Nothing was submitted before the deadline." : "Not submitted yet — the deadline hasn't passed."}</p>`}`);
  hydrateFiles(m);
}
const lateBy = d => { const h = d / 3600e3; return h < 1 ? Math.max(1, Math.round(d / 60000)) + " min" : h < 48 ? Math.round(h) + " h" : Math.round(h / 24) + " days"; };

function exportCSV() {
  const { students, assignments, subMap, cls } = T, q = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [["Student", "Email", ...assignments.map(a => `${a.title} (due ${new Date(a.deadline).toLocaleDateString()})`)].map(q).join(",")];
  students.forEach(s => lines.push([s.name, s.email, ...assignments.map(a => { const sub = subMap[a.id + "|" + s.uid], k = statusOf(a, sub); return LABEL[k] + (sub ? ` ${new Date(sub.submittedAt).toLocaleString()}` : ""); })].map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${cls.name.replace(/[^\w]+/g, "_")}_homework.csv`; a.click();
}

function tabAssignments() {
  const { assignments, students, subMap, cls } = T;
  const tmr = new Date(Date.now() + 864e5); tmr.setHours(23, 59, 0, 0);
  const local = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  $("#tabBody").innerHTML = `
    <div class="card"><h2>Add homework</h2>
      <form id="aForm">
        <label>Title</label><input type="text" name="title" required maxlength="120" placeholder="e.g. Exercises 1–5, page 40">
        <label>Instructions (optional)</label><textarea name="desc" maxlength="2000"></textarea>
        <label>Deadline</label><input type="datetime-local" name="deadline" required value="${local(tmr)}" style="max-width:260px">
        <div class="err" id="aErr"></div>
        <button class="btn primary">Add homework</button>
      </form></div>
    <div class="card"><h2>All homework — ${esc(cls.name)}</h2>
      ${assignments.length ? assignments.slice().reverse().map(a => {
        const sent = students.filter(s => subMap[a.id + "|" + s.uid]).length, closed = Date.now() > a.deadline;
        return `<div class="list-item"><div><b>${esc(a.title)}</b><div class="small muted">Due ${fmt(a.deadline)} · ${closed ? "closed" : timeLeft(a.deadline)} · ${sent}/${students.length} submitted</div></div>
          <button class="btn sm danger" data-del="${a.id}">Delete</button></div>`; }).join("") : `<p class="muted">None yet.</p>`}
    </div>`;
  $("#aForm").onsubmit = async e => {
    e.preventDefault(); const f = e.target, dl = new Date(f.deadline.value).getTime();
    if (!dl) return $("#aErr").textContent = "Please choose a deadline.";
    const done = busy(f.querySelector("button"), "Adding…");
    try { await api.createAssignment({ classId: cls.id, title: f.title.value.trim(), description: f.desc.value.trim(), deadline: dl }); toast("Homework added ✓"); await renderTeacher(); }
    catch (err) { $("#aErr").textContent = niceError(err); done(); }
  };
  $("#tabBody").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!await askConfirm("Delete this homework? Students' submissions for it will no longer be shown.")) return;
    const done = busy(b, "Deleting…");
    try { await api.deleteAssignment(b.dataset.del); toast("Homework deleted"); await renderTeacher(); } catch (e) { done(); toast(niceError(e)); }
  });
}

function tabStudents() {
  const { students, assignments, subMap, cls } = T, due = assignments.filter(a => a.deadline <= Date.now());
  $("#tabBody").innerHTML = `<div class="card">
    <p class="small muted" style="margin-top:0">Students join by creating an account and entering the code <span class="code">${esc(cls.code)}</span>.</p>
    ${students.length ? students.map(s => {
      const c = { ontime: 0, late: 0, missing: 0 }; due.forEach(a => c[statusOf(a, subMap[a.id + "|" + s.uid])]++);
      return `<div class="list-item"><div><b>${esc(s.name)}</b><div class="small muted">${esc(s.email)}</div>
        <div class="row small" style="gap:6px;margin-top:4px"><span class="badge s-ontime">${c.ontime} on time</span><span class="badge s-late">${c.late} late</span><span class="badge s-missing">${c.missing} missing</span></div></div>
        <button class="btn sm danger" data-rm="${s.uid}">Remove</button></div>`; }).join("") : `<p class="muted">No students yet.</p>`}
  </div>`;
  $("#tabBody").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!await askConfirm("Remove this student from the class?", "Remove")) return;
    const done = busy(b, "Removing…");
    try { await api.removeStudent(cls.id, b.dataset.rm); toast("Student removed"); await renderTeacher(); } catch (e) { done(); toast(niceError(e)); }
  });
}

function renderNewClass(first) {
  shell(`<div class="auth card"><h2>${first ? "Create your first class" : "New class"}</h2>
    <form id="cForm"><label>Class name</label><input type="text" name="name" required maxlength="80" placeholder="e.g. Grade 9 — English">
    <div class="err" id="cErr"></div>
    <div class="row"><button class="btn primary">Create class</button>${first ? "" : `<button type="button" class="btn" id="back">Back</button>`}</div></form>
    <p class="small muted">You'll get a 6-letter code to share with the students.</p></div>`);
  $("#back")?.addEventListener("click", () => renderTeacher(false));
  $("#cForm").onsubmit = async e => {
    e.preventDefault(); const done = busy(e.target.querySelector("button.primary"), "Creating class…");
    try { const c = await api.createClass(e.target.name.value.trim()); state.classId = c.id; state.tab = "overview"; toast("Class created ✓"); await renderTeacher(); }
    catch (err) { $("#cErr").textContent = niceError(err); done(); }
  };
}

/* ---------- boot ---------- */
(async () => {
  try { api = DEMO ? makeDemoApi() : await makeFirebaseApi(); }
  catch (e) { app.innerHTML = `<div class="wrap"><div class="card err">Could not load Firebase: ${esc(e.message)}</div></div>`; return; }
  api.onAuth((user, err) => {
    me = user; authGen++;
    if (!user) return renderAuth();
    loaderScreen(user.teacher ? "Loading your classes…" : "Loading your homework…");
    (user.teacher ? renderTeacher() : renderStudent()).catch(e => {
      console.error(e); shell(`<div class="card err">Something went wrong: ${esc(niceError(e))}<br><br>If you just set up Firebase, check that the security rules were published (see SETUP.md).</div>`);
    });
  });
})();
</script>
